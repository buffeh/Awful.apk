name: Build APK

on:
  push:
    branches:
      - imgur-proxy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: ${{ env.DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          echo "Found APK at $APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated debug build of ${{ github.sha }}"
