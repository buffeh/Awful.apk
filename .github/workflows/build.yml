name: Build APK

on:
  push:
    branches:
      - imgur-proxy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Debug keystore restored."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set - a throwaway debug key will be generated."
          fi

      - name: Build the debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi
          echo "Found APK at $APK"
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated debug build of ${{ github.sha }}"
